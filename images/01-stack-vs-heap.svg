<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#fff"/>
<style>
.t{font-family:Arial,sans-serif;fill:#172b4d}.muted{font-family:Arial,sans-serif;fill:#52606d}
.box{stroke-width:2.5}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}
.body{font-size:22px}.small{font-size:16px}
</style>
<text x="700" y="75" text-anchor="middle" class="t title">STACK VS. HEAP</text>
<text x="700" y="125" text-anchor="middle" class="muted" font-size="19">A local pointer can live on the stack while the object it points to lives on the heap.</text>
<rect x="75" y="165" width="575" height="500" rx="18" fill="#f3f7fa" stroke="#315a7d" class="box"/>
<rect x="750" y="165" width="575" height="500" rx="18" fill="#fff7f0" stroke="#b85c1b" class="box"/>
<text x="362" y="220" text-anchor="middle" class="t head" fill="#244a68">STACK • main() frame</text>
<text x="1037" y="220" text-anchor="middle" class="t head" fill="#a64b12">HEAP • dynamic allocation</text>
<rect x="135" y="260" width="455" height="105" rx="12" fill="#fff" stroke="#315a7d" class="box"/>
<text x="155" y="305" class="t body">int a = 30</text><text x="155" y="342" class="muted small">value stored directly in local variable</text>
<rect x="135" y="420" width="455" height="145" rx="12" fill="#fff" stroke="#315a7d" class="box"/>
<text x="155" y="465" class="t body">int* b</text><text x="155" y="505" class="muted small">b stores an address — not the heap integer</text>
<rect x="165" y="515" width="395" height="34" rx="7" fill="#fff0e2" stroke="#e87524" stroke-width="2"/>
<text x="362" y="538" text-anchor="middle" font-family="Arial" font-size="16" fill="#9a4b12">0x7F…4000 (example address)</text>
<rect x="835" y="330" width="405" height="150" rx="12" fill="#fff" stroke="#b85c1b" class="box"/>
<text x="1037" y="375" text-anchor="middle" font-family="Arial" font-size="24" fill="#8c3b0b">allocated int</text>
<text x="1037" y="445" text-anchor="middle" class="t" font-size="34">30</text>
<text x="1037" y="545" text-anchor="middle" font-family="Arial" font-size="18" fill="#8c3b0b">new int(30)</text>
<path d="M560 532 C650 532 700 405 830 405" fill="none" stroke="#e87524" stroke-width="3" stroke-linecap="round"/>
<path d="M818 397 L832 405 L818 413" fill="none" stroke="#e87524" stroke-width="3" stroke-linecap="round"/>
<text x="695" y="455" text-anchor="middle" font-family="Arial" font-size="16" fill="#e87524">b points to</text>
<rect x="110" y="590" width="505" height="48" rx="8" fill="#eaf0f3" stroke="#78909c" stroke-width="2"/>
<text x="362" y="620" text-anchor="middle" font-family="Arial" font-size="15" fill="#334e5c">Stack: local variables and their values/addresses</text>
<rect x="785" y="590" width="505" height="48" rx="8" fill="#fff0e2" stroke="#d98a4a" stroke-width="2"/>
<text x="1037" y="620" text-anchor="middle" font-family="Arial" font-size="15" fill="#8c3b0b">Heap: dynamically allocated object</text>
</svg>